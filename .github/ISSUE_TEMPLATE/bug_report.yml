name: Bug report
description: Something in the app or server does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove API keys, tokens and personal data from logs and screenshots before posting.
        For security problems, use the private report described in SECURITY.md instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Android app
        - Cloudflare Worker
        - Go backend / Docker
        - Web dashboard
        - Integration (sync or webhook)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings → Application information
      placeholder: "1.1.0"
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 8, Android 16"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Remove keys and personal data first.
