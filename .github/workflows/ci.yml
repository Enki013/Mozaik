name: CI

# Builds and tests every commit pushed to any branch and every pull request.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

# Pull requests only need their latest commit built; pushes keep a build per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Sign with the Mozaik release key when the secrets are available.
      # Pull requests from forks don't get secrets and fall back to the debug key.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MOZAIK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "MOZAIK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::notice::No release key available, signing with the debug key."
          fi

      - name: Lint, test and build
        env:
          MOZAIK_KEYSTORE_PASSWORD: ${{ secrets.MOZAIK_KEYSTORE_PASSWORD }}
          MOZAIK_KEY_ALIAS: ${{ secrets.MOZAIK_KEY_ALIAS }}
          MOZAIK_KEY_PASSWORD: ${{ secrets.MOZAIK_KEY_PASSWORD }}
        run: ./gradlew :app:lintRelease :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p ../ci-artifacts
          cp app/build/outputs/apk/release/app-release.apk "../ci-artifacts/mozaik-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mozaik-apk-${{ github.sha }}
          path: ci-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.sha }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7

  backend:
    name: Go backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
