name: Release

# Publishes a signed release when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# The tag must match versionName in android/app/build.gradle.kts.
# Everyday commits are built by ci.yml instead.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.2.0"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Resolve tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Check tag matches versionName
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts | head -n 1 | tr -d '[:space:]')"
          if [ "v${VERSION_NAME#v}" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match versionName $VERSION_NAME. Bump versionName (and versionCode) first."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MOZAIK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::MOZAIK_KEYSTORE_BASE64 secret is missing; refusing to publish a debug-signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MOZAIK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Lint, test and build APK and AAB
        working-directory: android
        env:
          MOZAIK_KEYSTORE_PASSWORD: ${{ secrets.MOZAIK_KEYSTORE_PASSWORD }}
          MOZAIK_KEY_ALIAS: ${{ secrets.MOZAIK_KEY_ALIAS }}
          MOZAIK_KEY_PASSWORD: ${{ secrets.MOZAIK_KEY_PASSWORD }}
        run: ./gradlew :app:lintRelease :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify release signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then
            echo "::error::APK is signed with the debug key."
            exit 1
          fi

      - name: Collect APK, AAB and SHA-256
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "release-artifacts/mozaik-${RELEASE_TAG}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release-artifacts/mozaik-${RELEASE_TAG}.aab"
          cd release-artifacts
          sha256sum *.apk *.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate changelog from Conventional Commits
        shell: bash
        run: |
          set -euo pipefail

          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..${RELEASE_TAG}"
          else
            RANGE="${RELEASE_TAG}"
          fi

          tmpdir="$(mktemp -d)"
          features="$tmpdir/features.md"
          fixes="$tmpdir/fixes.md"
          chores="$tmpdir/chores.md"
          docs="$tmpdir/docs.md"
          perf="$tmpdir/perf.md"
          refactor="$tmpdir/refactor.md"
          build_ci="$tmpdir/build-ci.md"
          tests="$tmpdir/tests.md"
          other="$tmpdir/other.md"
          breaking="$tmpdir/breaking.md"

          touch "$features" "$fixes" "$chores" "$docs" "$perf" "$refactor" "$build_ci" "$tests" "$other" "$breaking"
          conventional_regex='^([a-zA-Z]+)(\([^)]+\))?(!)?:[[:space:]]+(.+)$'

          while IFS= read -r subject; do
            [ -z "$subject" ] && continue

            if [[ "$subject" =~ $conventional_regex ]]; then
              type="${BASH_REMATCH[1]}"
              bang="${BASH_REMATCH[3]}"
              text="${BASH_REMATCH[4]}"
            else
              type="other"
              bang=""
              text="$subject"
            fi

            [ "$bang" = "!" ] && printf -- "- %s\n" "$text" >> "$breaking"

            case "$type" in
              feat) printf -- "- %s\n" "$text" >> "$features" ;;
              fix) printf -- "- %s\n" "$text" >> "$fixes" ;;
              chore) printf -- "- %s\n" "$text" >> "$chores" ;;
              docs) printf -- "- %s\n" "$text" >> "$docs" ;;
              perf) printf -- "- %s\n" "$text" >> "$perf" ;;
              refactor) printf -- "- %s\n" "$text" >> "$refactor" ;;
              build|ci) printf -- "- %s\n" "$text" >> "$build_ci" ;;
              test) printf -- "- %s\n" "$text" >> "$tests" ;;
              *) printf -- "- %s\n" "$text" >> "$other" ;;
            esac
          done < <(git log --format=%s --no-merges "$RANGE")

          mkdir -p release-artifacts
          changelog="release-artifacts/CHANGELOG.md"
          {
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Changes since ${PREVIOUS_TAG}."
            else
              echo "Initial release."
            fi
            echo

            if [ -s "$breaking" ]; then
              echo "### Breaking Changes"
              cat "$breaking"
              echo
            fi
            if [ -s "$features" ]; then
              echo "### Features"
              cat "$features"
              echo
            fi
            if [ -s "$fixes" ]; then
              echo "### Bug Fixes"
              cat "$fixes"
              echo
            fi
            if [ -s "$chores" ]; then
              echo "### Chores"
              cat "$chores"
              echo
            fi
            if [ -s "$docs" ]; then
              echo "### Documentation"
              cat "$docs"
              echo
            fi
            if [ -s "$perf" ]; then
              echo "### Performance"
              cat "$perf"
              echo
            fi
            if [ -s "$refactor" ]; then
              echo "### Refactoring"
              cat "$refactor"
              echo
            fi
            if [ -s "$build_ci" ]; then
              echo "### Build & CI"
              cat "$build_ci"
              echo
            fi
            if [ -s "$tests" ]; then
              echo "### Tests"
              cat "$tests"
              echo
            fi
            if [ -s "$other" ]; then
              echo "### Other Changes"
              cat "$other"
              echo
            fi
          } > "$changelog"

          cat "$changelog"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release-artifacts/
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-artifacts/CHANGELOG.md
          else
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "Mozaik $RELEASE_TAG" \
              --notes-file release-artifacts/CHANGELOG.md
          fi
          gh release upload "$RELEASE_TAG" \
            release-artifacts/*.apk \
            release-artifacts/*.aab \
            release-artifacts/SHA256SUMS.txt \
            --clobber
