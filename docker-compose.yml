services:
  personal-records:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: personal-records:latest
    container_name: personal-records
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - HOST=0.0.0.0
      - DB_PATH=/data/personal_records.sqlite3
      # Using FatSecret OAuth from a phone on your local network? Set APP_BASE_URL in .env to your local IP (e.g. http://192.168.1.50:8787)
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8787}
      # Security and authentication: set API_KEY in a .env file next to this file, or in your shell
      - API_KEY=${API_KEY:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Optional: FatSecret public food search (OAuth 2.0)
      - FATSECRET_CLIENT_ID=${FATSECRET_CLIENT_ID:-}
      - FATSECRET_CLIENT_SECRET=${FATSECRET_CLIENT_SECRET:-}
      # Optional: your FatSecret diary (OAuth 1.0)
      - FATSECRET_CONSUMER_KEY=${FATSECRET_CONSUMER_KEY:-}
      - FATSECRET_CONSUMER_SECRET=${FATSECRET_CONSUMER_SECRET:-}
      # Optional: Last.fm defaults (can also be set in the app)
      - LASTFM_USERNAME=${LASTFM_USERNAME:-}
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8787/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
